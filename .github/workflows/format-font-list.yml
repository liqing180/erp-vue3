name: 临时格式化字体列表

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/format-font-list.yml
      - src/views/system/emailManagement/editor/btns/BtnFontNameList.vue

permissions:
  contents: write

jobs:
  format:
    name: 格式化字体列表
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Yarn
        run: npm install --global yarn@1.22.22

      - name: 安装依赖
        run: yarn install --non-interactive --network-timeout 100000

      - name: 使用 Prettier 格式化目标文件
        run: yarn prettier --write src/views/system/emailManagement/editor/btns/BtnFontNameList.vue

      - name: 提交格式化结果
        shell: bash
        run: |
          if git diff --quiet; then
            echo '无需格式化'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/views/system/emailManagement/editor/btns/BtnFontNameList.vue
          git commit -m '格式化：修正字体列表组件代码格式'
          git push origin HEAD:develop
