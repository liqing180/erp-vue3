name: PR finalize once

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/pr-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --non-interactive --network-timeout 100000

      - name: Apply PR parity fixes
        shell: bash
        run: |
          set -euo pipefail
          LIST='src/views/purchaseManagement/purchaseRequisition/index.vue'
          FORM='src/views/purchaseManagement/purchaseRequisition/PurchaseRequisitionForm.vue'

          sed -i '/approvedStatusOptions: \[\],/a\      requiredTypeOptions: [],' "$LIST"
          sed -i 's/const \[status, approved\] = await Promise.all(/const [status, approved, requiredType] = await Promise.all(/' "$LIST"
          sed -i "/MyDictDataClass.getDictFn('approved_status')/s/$/,/" "$LIST"
          sed -i "/MyDictDataClass.getDictFn('approved_status'),/a\        MyDictDataClass.getDictFn('p_required_type')" "$LIST"
          sed -i '/this.approvedStatusOptions = approved || \[\]/a\      this.requiredTypeOptions = requiredType || []' "$LIST"

          sed -i '/@click="productDialogVisible = true"/i\                :disabled="form.dropShipping !== '\''1'\'' && !form.warehouseId"' "$FORM"
          sed -i '/@click="addAdhocRow"/i\                :disabled="form.dropShipping !== '\''1'\'' && !form.warehouseId"' "$FORM"
          sed -i '/@click="addCustomRow"/i\                :disabled="form.dropShipping !== '\''1'\'' && !form.warehouseId"' "$FORM"
          sed -i "s/:disabled=\"formReadOnly || containsSystemDockingProduct\"/:disabled=\"formReadOnly || containsSystemDockingProduct || form.isSalesDropShipping === '1'\"/" "$FORM"

          grep -q 'requiredTypeOptions: \[\]' "$LIST"
          grep -q "getDictFn('p_required_type')" "$LIST"
          grep -q "form.isSalesDropShipping === '1'" "$FORM"

      - name: Fix PR lint formatting
        run: |
          yarn eslint \
            src/views/purchaseManagement/lang/index.js \
            src/views/purchaseManagement/purchaseRequisition/PurchaseRequisitionForm.vue \
            src/views/purchaseManagement/purchaseRequisition/index.vue \
            src/views/purchaseManagement/purchaseRequisition/components/PrActionDialog.vue \
            src/views/purchaseManagement/purchaseRequisition/components/ProductSelectDialog.vue \
            src/views/purchaseManagement/purchaseRequisition/components/RevisionCompareDialog.vue \
            --fix

      - name: ESLint
        run: yarn eslint src

      - name: Build production
        run: yarn build:prod

      - name: Dev smoke
        shell: bash
        env:
          CI: 'true'
          VITE_APP_ENV: development
          VITE_APP_BASE_API: /dev-api
          VITE_APP_URL: http://127.0.0.1:65535
          VITE_PORT: '8088'
        run: |
          set -euo pipefail
          yarn dev --host 127.0.0.1 --port 8088 > /tmp/pr-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              cat /tmp/pr-dev.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8088/ > /dev/null; then
              curl --fail --silent http://127.0.0.1:8088/src/main.js > /dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pr-dev.log
          exit 1

      - name: Commit final PR migration
        shell: bash
        run: |
          rm .github/workflows/pr-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/purchaseManagement .github/workflows/pr-finalize-once.yml
          git commit -m "fix(pr): close purchase requisition parity gaps"
          git push origin HEAD:develop
