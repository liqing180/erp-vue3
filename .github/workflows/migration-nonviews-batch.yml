name: ERP 非 views 批量迁移

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[migration-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 ERP-VUE3
        uses: actions/checkout@v4
        with:
          ref: develop
          path: target

      - name: 拉取 ERP-VUE2
        uses: actions/checkout@v4
        with:
          repository: liqing180/erp-vue2
          ref: main
          path: source

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Yarn
        run: npm install --global yarn@1.22.22

      - name: 合并 ERP API 契约与 Vue3 扩展
        run: |
          cp -R target/src/api target-api-original
          cp -R source/src/api/. target/src/api/

          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          source_api = Path('source/src/api')
          target_api = Path('target/src/api')
          old_target_api = Path('target-api-original')

          def skip_string_or_comment(text, i):
              if text.startswith('//', i):
                  j = text.find('\n', i + 2)
                  return len(text) if j < 0 else j
              if text.startswith('/*', i):
                  j = text.find('*/', i + 2)
                  return len(text) if j < 0 else j + 2
              quote = text[i]
              if quote not in "'\"`":
                  return None
              i += 1
              while i < len(text):
                  if text[i] == '\\':
                      i += 2
                      continue
                  if text[i] == quote:
                      return i + 1
                  i += 1
              return len(text)

          def find_balanced_block(text, open_pos):
              pairs = {'{': '}', '(': ')', '[': ']'}
              stack = [pairs[text[open_pos]]]
              i = open_pos + 1
              while i < len(text) and stack:
                  jump = skip_string_or_comment(text, i)
                  if jump is not None:
                      i = jump
                      continue
                  ch = text[i]
                  if ch in pairs:
                      stack.append(pairs[ch])
                  elif stack and ch == stack[-1]:
                      stack.pop()
                  i += 1
              return i

          def extract_exports(text):
              result = {}
              pattern = re.compile(
                  r'export\s+(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\('
                  r'|export\s+const\s+([A-Za-z_$][\w$]*)\s*='
              )
              for match in pattern.finditer(text):
                  name = match.group(1) or match.group(2)
                  start = match.start()
                  if match.group(1):
                      open_pos = text.find('{', match.end())
                      if open_pos < 0:
                          continue
                      end = find_balanced_block(text, open_pos)
                      while end < len(text) and text[end] in '; \t':
                          end += 1
                  else:
                      i = match.end()
                      stack = []
                      end = len(text)
                      while i < len(text):
                          jump = skip_string_or_comment(text, i)
                          if jump is not None:
                              i = jump
                              continue
                          ch = text[i]
                          if ch in '({[':
                              stack.append({'(': ')', '{': '}', '[': ']'}[ch])
                          elif stack and ch == stack[-1]:
                              stack.pop()
                          elif ch == '\n' and not stack:
                              end = i
                              break
                          elif ch == ';' and not stack:
                              end = i + 1
                              break
                          i += 1
                  result[name] = text[start:end].rstrip()
              return result

          preserved = []
          for old_file in old_target_api.rglob('*.js'):
              rel = old_file.relative_to(old_target_api)
              new_file = target_api / rel
              if not new_file.exists():
                  # Vue3/CRM 独有 API 文件保留，不属于同路径业务契约冲突。
                  new_file.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(old_file, new_file)
                  continue

              source_text = new_file.read_text(encoding='utf-8')
              old_text = old_file.read_text(encoding='utf-8')
              source_exports = extract_exports(source_text)
              old_exports = extract_exports(old_text)
              extras = [
                  declaration
                  for name, declaration in old_exports.items()
                  if name not in source_exports
              ]
              if extras:
                  source_text = source_text.rstrip() + '\n\n' + '\n\n'.join(extras) + '\n'
                  new_file.write_text(source_text, encoding='utf-8')
                  preserved.append((rel.as_posix(), sorted(set(old_exports) - set(source_exports))))

          # Vue CLI 环境变量统一迁移为 Vite。
          for file in target_api.rglob('*.js'):
              text = file.read_text(encoding='utf-8')
              text = text.replace('process.env.VUE_APP_BASE_API', 'import.meta.env.VITE_APP_BASE_API')
              text = text.replace('process.env.VUE_APP_URL', 'import.meta.env.VITE_APP_URL')
              text = text.replace('process.env.VUE_APP_ENV', 'import.meta.env.VITE_APP_ENV')
              file.write_text(text, encoding='utf-8')

          print(f'PRESERVED_VUE3_API_FILES={len(preserved)}')
          for path, names in preserved:
              print(f'{path}: {", ".join(names)}')

          # 补齐 ERP 业务图片与 SVG，不覆盖 Vue3 已有同名资源。
          pairs = [
              (Path('source/src/assets/icons/svg'), Path('target/src/assets/icons/svg')),
              (Path('source/src/assets/images'), Path('target/src/assets/images')),
          ]
          copied = []
          for src_root, dst_root in pairs:
              for source_file in src_root.rglob('*'):
                  if not source_file.is_file():
                      continue
                  rel = source_file.relative_to(src_root)
                  target_file = dst_root / rel
                  if target_file.exists():
                      continue
                  target_file.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source_file, target_file)
                  copied.append(target_file.as_posix())

          print(f'COPIED_ASSET_FILES={len(copied)}')
          PY

      - name: 安装依赖
        working-directory: target
        run: yarn install --non-interactive --network-timeout 100000

      - name: 格式化 ERP API
        working-directory: target
        run: yarn prettier --write src/api

      - name: ESLint 检查
        working-directory: target
        run: yarn eslint src

      - name: 生产构建
        working-directory: target
        run: yarn build:prod

      - name: 提交迁移结果
        working-directory: target
        run: |
          if [ -z "$(git status --porcelain src/api src/assets/icons/svg src/assets/images)" ]; then
            echo "API 与业务资源已对齐"
            exit 0
          fi
          git config user.name "liqing180"
          git config user.email "54855614+liqing180@users.noreply.github.com"
          git add src/api src/assets/icons/svg src/assets/images
          git commit -m "迁移：对齐 ERP API 契约与业务资源 [migration-auto]"
          git push origin HEAD:develop
