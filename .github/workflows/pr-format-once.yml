name: PR one-time formatter

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/pr-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format PR migration files
        run: |
          npx --yes prettier@3.6.2 --write \
            src/views/purchaseManagement/lang/index.js \
            src/views/purchaseManagement/purchaseRequisition/PurchaseRequisitionForm.vue \
            src/views/purchaseManagement/purchaseRequisition/index.vue \
            src/views/purchaseManagement/purchaseRequisition/components/PrActionDialog.vue \
            src/views/purchaseManagement/purchaseRequisition/components/ProductSelectDialog.vue \
            src/views/purchaseManagement/purchaseRequisition/components/RevisionCompareDialog.vue

      - name: Commit formatting and remove one-time workflow
        run: |
          rm .github/workflows/pr-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/purchaseManagement .github/workflows/pr-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(pr): format migrated purchase requisition files"
          git push origin HEAD:develop
