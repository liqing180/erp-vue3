name: PR product hover fix once

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/pr-product-hover-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Patch PR list
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/views/purchaseManagement/purchaseRequisition/index.vue')
          text = path.read_text()

          old = "        <template #default=\"scope\">\n          <template v-if=\"item.prop === 'dropShipping'\">"
          new = """        <template #default="scope">
          <template v-if="item.prop === 'productName'">
            <div
              @mouseenter="showPop($event, scope.row)"
              @mouseleave="hidePop($event, scope.row)"
            >
              <div class="ellipsis-text">{{ scope.row.productName }}</div>
            </div>
          </template>
          <template v-else-if="item.prop === 'dropShipping'">"""
          assert old in text, 'productName cell anchor not found'
          text = text.replace(old, new, 1)

          old = "    <ExportDlg\n      ref=\"ExportDlgRef\"\n      :loading=\"exportLoading\"\n      @export=\"handleExport\"\n    />\n  </div>"
          new = """    <ExportDlg
      ref="ExportDlgRef"
      :loading="exportLoading"
      @export="handleExport"
    />

    <ToolTipShowListForFN ref="ToolTipShowList" />
  </div>"""
          assert old in text, 'tooltip component anchor not found'
          text = text.replace(old, new, 1)

          old = "import pageMixin from '@/mixins/tableMinx'\n"
          new = old + "import ToolTipShowListForFN from '@/components/Common/ToolTipShowList/tableUse.vue'\n"
          assert old in text, 'import anchor not found'
          text = text.replace(old, new, 1)

          old = "export default {\n  name: 'PurchaseRequisition',\n  mixins: [pageMixin],"
          new = "export default {\n  name: 'PurchaseRequisition',\n  components: { ToolTipShowListForFN },\n  mixins: [pageMixin],"
          assert old in text, 'component registration anchor not found'
          text = text.replace(old, new, 1)

          old = "  methods: {\n    column(prop, label, minWidth, tooltip = true, sortable = false, propBy) {"
          new = """  methods: {
    showPop(e, row) {
      const list = row.purchaseRequisiteDetailList || []
      const params = {
        labelKey: 'productName',
        list
      }
      if (list.length > 0 && this.$refs.ToolTipShowList) {
        this.$refs.ToolTipShowList.showPop(e, params)
      }
    },
    hidePop(e) {
      if (this.$refs.ToolTipShowList) {
        this.$refs.ToolTipShowList.hidePop(e)
      }
    },
    column(prop, label, minWidth, tooltip = true, sortable = false, propBy) {"""
          assert old in text, 'methods anchor not found'
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit fix
        run: |
          rm .github/workflows/pr-product-hover-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/purchaseManagement/purchaseRequisition/index.vue .github/workflows/pr-product-hover-fix-once.yml
          git commit -m "fix(pr): restore product hover detail list"
          git push origin HEAD:develop
